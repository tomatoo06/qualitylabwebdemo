<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghost Paper Scan</title>
    <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
    <div class="app">
        <!-- LIVE CAMERA -->
        <section class="camera-screen" id="cameraScreen">
            <video id="camera" autoplay playsinline muted></video>
            <canvas id="overlayCanvas"></canvas>

            <div class="top-ui">
                <div class="status-pill">
                    <span id="statusDot" class="status-dot"></span>
                    <div class="status-copy">
                        <strong id="statusText">กำลังเปิดกล้อง...</strong>
                        <span id="statusSub">รอสักครู่</span>
                    </div>
                </div>
            </div>

            <div class="bottom-ui">
                <button id="captureBtn" class="capture-btn">CAPTURE</button>
            </div>
        </section>

        <!-- RESULT / POSTER -->
        <section class="result-screen" id="resultScreen">
            <img id="resultImage" alt="Captured poster result" />

            <div class="result-actions">
                <button id="retakeBtn" class="action-btn secondary">Retake</button>
                <button id="downloadBtn" class="action-btn primary">Download</button>
            </div>
        </section>

        <!-- hidden canvas -->
        <canvas id="captureCanvas" class="hidden-canvas"></canvas>
    </div>

    <script src="./js/app.js"></script>
</body>

</html>
